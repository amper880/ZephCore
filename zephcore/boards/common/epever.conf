# Epever Tracer AN / AN G3 charge controller telemetry over RS-485 (Modbus RTU).
# Repeater and room server. The board's epever.overlay (auto-included with this
# file) puts the epever_modbus node on the UART the transceiver is wired to.
#
# Build example:
#   west build -b heltec_t114 zephcore --pristine -- \
#     -DEXTRA_CONF_FILE="boards/common/repeater.conf;boards/common/packet_logging.conf;boards/common/epever.conf"
#
# Transceiver: a 3.3 V TTL-RS485 module with automatic direction control (no
# DE/RE pins; a module that has them takes de-gpios/re-gpios in the overlay).
# Controller RJ45: pins 3/4 = B (-), 5/6 = A (+), 7/8 = GND. Pins 1/2 carry
# +5 V and stay unconnected.

CONFIG_ZEPHCORE_EPEVER=y
CONFIG_MODBUS=y
CONFIG_MODBUS_ROLE_CLIENT=y
CONFIG_MODBUS_FP_EXTENSIONS=n
