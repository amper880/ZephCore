# External I2C sensors on a second bus, for boards whose first bus (shared with
# the display) is not on the pin header. The board's sensors_i2c1.overlay
# (auto-included with this file) moves every node of sensors-i2c.dtsi to i2c1
# and gives its pins. The display stays on its own bus.
#
# Build example:
#   west build -b heltec_wifi_lora32_v3/esp32s3/procpu zephcore --pristine --sysbuild -- \
#     -DEXTRA_CONF_FILE="boards/common/repeater.conf;boards/common/repeater_uplink.conf;boards/common/sensors_i2c1.conf"

CONFIG_I2C=y
