# KISS modem role: raw LoRa packets to a host over the USB/console serial port
# (upstream MeshCore examples/kiss_modem, protocol in docs/kiss_modem_protocol.md).
#
# Build with: -DEXTRA_CONF_FILE="boards/common/kiss_modem.conf"

CONFIG_ZEPHCORE_ROLE_KISS_MODEM=y

# No BLE; entropy explicitly, as BT no longer pulls it in.
CONFIG_BT=n
CONFIG_ENTROPY_GENERATOR=y

# The port carries the binary KISS stream: the console driver must not also
# write to it, or boot and printk bytes land in the stream.
CONFIG_UART_CONSOLE=n
CONFIG_SHELL=n
